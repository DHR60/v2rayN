name: release Windows desktop (Avalonia UI) dotnet 10

on:
  workflow_dispatch:
  push:
    branches:
      - build

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    env:
      BUILD_MATRIX: |
        [
          {"runtime":"win-x64",  "package_arch":"windows-64-dotnet10",                      "self_contained":false, "optimize":false},
          {"runtime":"win-arm64","package_arch":"windows-arm64-dotnet10",                   "self_contained":false, "optimize":false},
          {"runtime":"win-x64",  "package_arch":"windows-64-SelfContained-dotnet10",        "self_contained":true,  "optimize":false},
          {"runtime":"win-arm64","package_arch":"windows-arm64-SelfContained-dotnet10",     "self_contained":true,  "optimize":false},
          {"runtime":"win-x64",  "package_arch":"windows-64-r2r-dotnet10",                  "self_contained":false, "optimize":true},
          {"runtime":"win-arm64","package_arch":"windows-arm64-r2r-dotnet10",               "self_contained":false, "optimize":true},
          {"runtime":"win-x86",  "package_arch":"windows-86-dotnet10",                      "self_contained":false, "optimize":false},
          {"runtime":"win-x86",  "package_arch":"windows-86-SelfContained-dotnet10",        "self_contained":true,  "optimize":false},
          {"runtime":"win-x86",  "package_arch":"windows-86-r2r-dotnet10",                  "self_contained":false, "optimize":true}
        ]
      OUTPUT_BASE: ${{ github.workspace }}/v2rayN/Release

    steps:
    - name: Checkout
      uses: actions/checkout@v6.0.1
      with:
        submodules: 'recursive'
        fetch-depth: '0'

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Replace net8.0 with net10.0
      shell: bash
      run: |
        find . -name "*.csproj" -type f -print0 | xargs -0 sed -i 's/net8\.0/net10\.0/g'
        find . -name "*.props" -type f -print0 | xargs -0 sed -i 's/net8\.0/net10\.0/g'

    - name: Build all variants
      shell: pwsh
      run: |
        Set-StrictMode -Version Latest
        $ErrorActionPreference = 'Stop'
        Push-Location v2rayN

        $matrix = $env:BUILD_MATRIX | ConvertFrom-Json
        foreach ($row in $matrix) {
          $runtime = $row.runtime
          $package_arch = $row.package_arch
          $self_contained = [bool]$row.self_contained
          $optimize = [bool]$row.optimize

          $outDir = "$env:OUTPUT_BASE/$package_arch"
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null

          Write-Host "==> Building $package_arch (RID=$runtime, SC=$self_contained, OPT=$optimize)"

          # Build args base
          $baseArgs = @("-c","Release","-r",$runtime,"-p:EnableWindowsTargeting=true","-o",$outDir)
          if ($self_contained) { $baseArgs += @("-p:SelfContained=true") } else { $baseArgs += @("-p:SelfContained=false") }

          # v2rayN.Desktop (Avalonia)
          $v2Args = @("./v2rayN.Desktop/v2rayN.Desktop.csproj") + $baseArgs
          if ($optimize) {
            $v2Args += @("-p:PublishReadyToRun=true","-p:PublishReadyToRunComposite=true")
          }
          & dotnet publish @v2Args

          # AmazTool：自包含时 Trim
          $amazArgs = @("./AmazTool/AmazTool.csproj") + $baseArgs
          if ($self_contained) {
            $amazArgs += @("-p:PublishTrimmed=true")
          }
          & dotnet publish @amazArgs
        }
        Pop-Location

    - name: Upload build artifacts (all variants)
      if: false
      uses: actions/upload-artifact@v7
      with:
        name: v2rayN-all-desktop
        path: "${{ env.OUTPUT_BASE }}/**"
        compression-level: 6

    # upload 7z archive to release for testing
    - name: Install 7z
      uses: milliewalky/setup-7-zip@v2

    - name: Package release 7z archives
      shell: pwsh
      run: |
        Set-StrictMode -Version Latest
        $matrix = $env:BUILD_MATRIX | ConvertFrom-Json
        foreach ($row in $matrix) {
          $package_arch = $row.package_arch
          $outDir = "$env:OUTPUT_BASE/$package_arch"
          bash package-release-7z.sh "$package_arch" "$outDir"
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Failed to package ${package_arch}, continuing..."
            continue
          }
          $src = "v2rayN-$package_arch.7z"
          $dst = "v2rayN-$package_arch-desktop.7z"
          if (Test-Path $src) { Remove-Item -Force $dst -ErrorAction SilentlyContinue; Rename-Item -Force $src $dst }
        }
        exit 0

    - name: Create git tag
      uses: actions/github-script@v8
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          try {
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'refs/tags/build-${{ github.sha }}',
              sha: context.sha
            });
            core.info('✅ Tag created: build-${{ github.sha }}');
          } catch (err) {
            if (err.status === 422) {
              core.info('⚠️ Tag already exists: build-${{ github.sha }} (no override)');
            } else {
              throw err;
            }
          }

    - name: Upload 7z archive to release for testing
      uses: svenstaro/upload-release-action@v2
      with:
        file: ${{ github.workspace }}/v2rayN-*-desktop.7z
        release_name: build-${{ github.sha }}
        tag: build-${{ github.sha }}
        file_glob: true
        prerelease: true