name: release Linux

on:
  workflow_dispatch:
    inputs:
      release_tag:
        required: false
        type: string
  push:
    branches:
      - master
      - build

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      BUILD_MATRIX: |
        [
          {"runtime":"linux-x64",  "package_arch":"linux-64",   "self_contained":true},
          {"runtime":"linux-arm64","package_arch":"linux-arm64","self_contained":true},
          {"runtime":"linux-arm",  "package_arch":"linux-arm",  "self_contained":true}
        ]
      OUTPUT_BASE: ${{ github.workspace }}/v2rayN/Release

    steps:
    - name: Checkout
      uses: actions/checkout@v6.0.2
      with:
        submodules: 'recursive'
        fetch-depth: '0'

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '8.0.x'

    - name: Ensure jq
      run: |
        sudo apt-get update
        sudo apt-get install -y jq

    - name: Build all variants
      shell: bash
      run: |
        set -euo pipefail
        cd v2rayN

        echo "$BUILD_MATRIX" | jq -c '.[]' | while read -r row; do
          runtime=$(echo "$row" | jq -r '.runtime')
          package_arch=$(echo "$row" | jq -r '.package_arch')
          self_contained=$(echo "$row" | jq -r '.self_contained')

          out_dir="${OUTPUT_BASE}/${package_arch}"
          mkdir -p "$out_dir"

          common_args="-c Release -r ${runtime} -p:SelfContained=true -o \"${out_dir}\""

          echo "==> Building ${package_arch} (RID=${runtime}, SC=${self_contained})"

          # v2rayN.Desktop
          eval dotnet publish ./v2rayN.Desktop/v2rayN.Desktop.csproj ${common_args}

          # AmazTool：保持原有 Trim 行为
          amaz_args="${common_args} -p:PublishTrimmed=true"
          eval dotnet publish ./AmazTool/AmazTool.csproj ${amaz_args}
        done

    - name: Upload build artifacts (all variants)
      uses: actions/upload-artifact@v7
      with:
        name: v2rayN-all-linux
        path: "${{ env.OUTPUT_BASE }}/**"

    - name: Upload build artifacts (for packaging)
      uses: actions/upload-artifact@v7
      with:
        name: v2rayN-linux
        path: |
          ${{ github.workspace }}/v2rayN/Release/linux*

    # release zip archive
    - name: Package release zip archive
      if: github.event.inputs.release_tag != ''
      shell: bash
      run: |
        set -euo pipefail
        chmod 755 package-release-zip.sh
        echo "$BUILD_MATRIX" | jq -c '.[]' | while read -r row; do
          package_arch=$(echo "$row" | jq -r '.package_arch')
          out_dir="${OUTPUT_BASE}/${package_arch}"
          ./package-release-zip.sh "${package_arch}" "${out_dir}" || echo "Warning: Failed to package ${package_arch}, continuing..."
        done
    
    - name: Upload zip archive to release
      uses: svenstaro/upload-release-action@v2
      if: github.event.inputs.release_tag != ''
      with:
        file: ${{ github.workspace }}/v2rayN*.zip
        tag: ${{ github.event.inputs.release_tag }}
        file_glob: true
        prerelease: true

    # upload 7z archive to release for testing
    - name: Install 7z
      if: github.event.inputs.release_tag == ''
      uses: milliewalky/setup-7-zip@v2

    - name: Package release 7z archive
      if: github.event.inputs.release_tag == ''
      shell: bash
      run: |
        set -euo pipefail
        chmod 755 package-release-7z.sh
        echo "$BUILD_MATRIX" | jq -c '.[]' | while read -r row; do
          package_arch=$(echo "$row" | jq -r '.package_arch')
          out_dir="${OUTPUT_BASE}/${package_arch}"
          ./package-release-7z.sh "${package_arch}" "${out_dir}" || echo "Warning: Failed to package ${package_arch}, continuing..."
        done

    - name: Create git tag
      if: github.event.inputs.release_tag == ''
      uses: actions/github-script@v8
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          try {
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'refs/tags/build-${{ github.sha }}',
              sha: context.sha
            });
            core.info('✅ Tag created: build-${{ github.sha }}');
          } catch (err) {
            if (err.status === 422) {
              core.info('⚠️ Tag already exists: build-${{ github.sha }} (no override)');
            } else {
              throw err;
            }
          }

    - name: Upload 7z archive to release for testing
      if: github.event.inputs.release_tag == ''
      uses: svenstaro/upload-release-action@v2
      with:
        file: ${{ github.workspace }}/v2rayN*.7z
        release_name: build-${{ github.sha }}
        tag: build-${{ github.sha }}
        file_glob: true
        prerelease: true

  deb:
    needs: build
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-24.04
    container:
      image: debian:13
    env:
      RELEASE_TAG: ${{ github.event.inputs.release_tag != '' && github.event.inputs.release_tag || github.ref_name }}

    steps:
    - name: Prepare tools (Debian)
      shell: bash
      run: |
        set -euo pipefail
        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        apt-get install -y sudo git rsync findutils tar gzip unzip which curl jq wget file \
                           ca-certificates desktop-file-utils xdg-utils fakeroot dpkg-dev \
                           libc6 libgcc-s1 libstdc++6 zlib1g libicu-dev libssl-dev

    - name: Checkout repo (for scripts)
      uses: actions/checkout@v6.0.2
      with:
        submodules: 'recursive'
        fetch-depth: '0'

    - name: Ensure script permissions
      run: chmod 755 package-debian.sh

    - name: Package DEB (Debian-family)
      run: ./package-debian.sh "${RELEASE_TAG}" --arch all

    - name: Collect DEBs into workspace
      run: |
        mkdir -p "$GITHUB_WORKSPACE/dist/deb"
        rsync -av "$HOME/debbuild/" "$GITHUB_WORKSPACE/dist/deb/" || true
        find "$GITHUB_WORKSPACE/dist/deb" -name "v2rayn_*_amd64.deb" \
          -exec mv {} "$GITHUB_WORKSPACE/dist/deb/v2rayN-linux-64.deb" \; || true
        find "$GITHUB_WORKSPACE/dist/deb" -name "v2rayn_*_arm64.deb" \
          -exec mv {} "$GITHUB_WORKSPACE/dist/deb/v2rayN-linux-arm64.deb" \; || true
        echo "==== Dist tree ===="
        ls -R "$GITHUB_WORKSPACE/dist/deb" || true

    - name: Upload DEB artifacts
      uses: actions/upload-artifact@v7.0.0
      with:
        name: v2rayN-deb
        path: dist/deb/**/*.deb

    - name: Upload DEBs to release
      uses: svenstaro/upload-release-action@v2
      with:
        file: dist/deb/**/*.deb
        tag: ${{ env.RELEASE_TAG }}
        file_glob: true
        prerelease: true

  rpm:
    needs: build
    if: github.event.inputs.release_tag != ''
    runs-on: ubuntu-24.04
    container:
      image: registry.access.redhat.com/ubi10/ubi
    env:
      RELEASE_TAG: ${{ github.event.inputs.release_tag != '' && github.event.inputs.release_tag || github.ref_name }}

    steps:
    - name: Prepare tools (Red Hat)
      shell: bash
      run: |
        set -euo pipefail

        . /etc/os-release
        EL_MAJOR="${VERSION_ID%%.*}"
        echo "EL_MAJOR=${EL_MAJOR}"

        dnf -y makecache || true
        command -v curl >/dev/null || dnf -y install curl ca-certificates

        ARCH="$(uname -m)"
        case "$ARCH" in x86_64|aarch64) ;; *) echo "Unsupported arch: $ARCH"; exit 1 ;; esac

        install_epel_from_dir() {
          local base="$1" rpm
          echo "Try: $base"

          rpm="$(
            {
              curl -fsSL "$base/Packages/"   2>/dev/null
              curl -fsSL "$base/Packages/e/" 2>/dev/null | sed 's|href="|href="e/|'
            } |
            sed -n 's/.*href="\([^"]*epel-release-[^"]*\.noarch\.rpm\)".*/\1/p' |
            sort -V | tail -n1
          )" || true

          if [[ -n "$rpm" ]]; then
            dnf -y install "$base/Packages/$rpm"
            return 0
          fi
          return 1
        }

        FEDORA="https://dl.fedoraproject.org/pub/epel/epel-release-latest-${EL_MAJOR}.noarch.rpm"
        echo "Try Fedora: $FEDORA"

        if curl -fsSLI "$FEDORA" >/dev/null; then
          dnf -y install "$FEDORA"
        else
          ROCKY="https://dl.rockylinux.org/pub/rocky/${EL_MAJOR}/extras/${ARCH}/os"
          if install_epel_from_dir "$ROCKY"; then
            :
          else
            ALMA="https://repo.almalinux.org/almalinux/${EL_MAJOR}/extras/${ARCH}/os"
            if install_epel_from_dir "$ALMA"; then
              :
            else
              echo "EPEL bootstrap failed (Fedora/Rocky/Alma)"
              exit 1
            fi
          fi
        fi

        dnf -y install sudo git rpm-build rpmdevtools dnf-plugins-core \
                       rsync findutils tar gzip unzip which

        dnf repolist | grep -i epel || true

    - name: Checkout repo (for scripts)
      uses: actions/checkout@v6.0.2
      with:
        submodules: 'recursive'
        fetch-depth: '0'

    - name: Restore build artifacts
      uses: actions/download-artifact@v8
      with:
        name: v2rayN-linux
        path: ${{ github.workspace }}/v2rayN/Release

    - name: Ensure script permissions
      run: chmod 755 package-rhel.sh

    - name: Package RPM (RHEL-family)
      run: ./package-rhel.sh "${RELEASE_TAG}" --arch all

    - name: Collect RPMs into workspace
      run: |
        mkdir -p "$GITHUB_WORKSPACE/dist/rpm"
        rsync -av "$HOME/rpmbuild/RPMS/" "$GITHUB_WORKSPACE/dist/rpm/" || true
        find "$GITHUB_WORKSPACE/dist/rpm" -name "v2rayN-*-1*.x86_64.rpm"  -exec mv {} "$GITHUB_WORKSPACE/dist/rpm/v2rayN-linux-rhel-64.rpm" \;  || true
        find "$GITHUB_WORKSPACE/dist/rpm" -name "v2rayN-*-1*.aarch64.rpm" -exec mv {} "$GITHUB_WORKSPACE/dist/rpm/v2rayN-linux-rhel-arm64.rpm" \; || true
        echo "==== Dist tree ===="
        ls -R "$GITHUB_WORKSPACE/dist/rpm" || true

    - name: Upload RPM artifacts
      uses: actions/upload-artifact@v7.0.0
      with:
        name: v2rayN-rpm
        path: dist/rpm/**/*.rpm

    - name: Upload RPMs to release
      uses: svenstaro/upload-release-action@v2
      with:
        file: dist/rpm/**/*.rpm
        tag: ${{ env.RELEASE_TAG }}
        file_glob: true
        prerelease: true
